name: Build Parent App APK from Zip

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Unzip Project Files
      run: |
        unzip ParentApp.zip -d .
        # Move files out of subfolder if the zip has one
        if [ -d "ParentApp" ]; then
          mv ParentApp/* .
          mv ParentApp/.* . 2>/dev/null || true
        fi

    - name: Nuclear Repair Build Files
      run: |
        # 1. Target every single file that could contain the broken version
        find . -type f \( -name "*.gradle" -o -name "*.kts" -o -name "*.properties" \) -exec sed -i 's/8\.5/8.2.2/g' {} +
        
        # 2. Force the correct Google and Maven repositories into the files
        find . -name "build.gradle" -exec sed -i '1i buildscript { repositories { google(); mavenCentral() }; dependencies { classpath "com.android.tools.build:gradle:8.2.2" } }' {} +
        
        # 3. Fix potential "libs.versions.toml" if the AI used modern version catalogs
        if [ -f "gradle/libs.versions.toml" ]; then
          sed -i 's/8\.5/8.2.2/g' gradle/libs.versions.toml
        fi

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Build APK with System Gradle
      run: gradle assembleDebug --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Android-Parent-App
        path: app/build/outputs/apk/debug/app-debug.apk
