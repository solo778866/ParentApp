name: Build Parent App APK from Zip

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Unzip Project Files
      run: |
        unzip ParentApp.zip -d .
        if [ -d "ParentApp" ]; then
          mv ParentApp/* .
          mv ParentApp/.* . 2>/dev/null || true
        fi

    - name: Deep Build Recovery
      run: |
        # 1. IDENTITY SWAP: Force the app to use the Child ID so the JSON key matches
        find . -type f \( -name "*.gradle" -o -name "*.kts" -o -name "AndroidManifest.xml" -o -name "*.kt" \) -exec sed -i 's/com.example.parentapp/com.example.childapp/g' {} +
        
        # 2. VERSION FIX: Swap the fake 8.5 version for 8.2.2
        find . -type f \( -name "*.gradle" -o -name "*.kts" -o -name "*.properties" \) -exec sed -i 's/8\.5/8.2.2/g' {} +
        
        # 3. COMPOSE REPAIR: Find any broken ui-tooling/ui-test lines and force version 1.5.0
        # This fixes the "Double Dot" error by replacing the line with a hardcoded one
        find . -type f \( -name "*.gradle" -o -name "*.kts" \) -exec sed -i 's/.*ui-tooling.*/    implementation "androidx.compose.ui:ui-tooling:1.5.0"/g' {} +
        find . -type f \( -name "*.gradle" -o -name "*.kts" \) -exec sed -i 's/.*ui-test-manifest.*/    debugImplementation "androidx.compose.ui:ui-test-manifest:1.5.0"/g' {} +

        # 4. REPO FIX: Allow defining repositories in build files
        if [ -f "settings.gradle" ]; then
          sed -i 's/FAIL_ON_PROJECT_REPOS/PREFER_PROJECT/g' settings.gradle
        fi

        # 5. MASTER INJECTION: Force clean build instructions at the top
        sed -i '1i buildscript { repositories { google(); mavenCentral() }; dependencies { classpath "com.android.tools.build:gradle:8.2.2" } }' build.gradle

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Build APK
      run: gradle assembleDebug --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Android-Parent-App
        path: app/build/outputs/apk/debug/app-debug.apk
