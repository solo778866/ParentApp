name: Build Parent App APK from Zip

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Unzip Project Files
      run: |
        unzip ParentApp.zip -d .
        if [ -d "ParentApp" ]; then
          mv ParentApp/* .
          mv ParentApp/.* . 2>/dev/null || true
        fi

    - name: Brute Force Recovery
      run: |
        # 1. Fix the fake Gradle Plugin version (8.5 -> 8.2.2)
        find . -type f \( -name "*.gradle" -o -name "*.kts" \) -exec sed -i 's/8\.5/8.2.2/g' {} +
        
        # 2. THE BRUTE FORCE: Find any mention of ui-tooling or ui-test-manifest 
        # and force them to use a stable version (1.5.4), ignoring whatever variables the AI used.
        find . -type f \( -name "*.gradle" -o -name "*.kts" \) -exec sed -i 's/.*ui-tooling.*/    implementation "androidx.compose.ui:ui-tooling:1.5.4"/g' {} +
        find . -type f \( -name "*.gradle" -o -name "*.kts" \) -exec sed -i 's/.*ui-test-manifest.*/    debugImplementation "androidx.compose.ui:ui-test-manifest:1.5.4"/g' {} +

        # 3. Resolve the "Google Repository" conflict by fixing settings.gradle
        if [ -f "settings.gradle" ]; then
          sed -i 's/FAIL_ON_PROJECT_REPOS/PREFER_PROJECT/g' settings.gradle
        fi

        # 4. Inject a master buildscript at the very top of build.gradle
        sed -i '1i buildscript { repositories { google(); mavenCentral() }; dependencies { classpath "com.android.tools.build:gradle:8.2.2" } }' build.gradle

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Build APK
      run: gradle assembleDebug --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Android-Parent-App
        path: app/build/outputs/apk/debug/app-debug.apk
