name: Build Parent App APK from Zip

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Unzip Project Files
      run: |
        unzip ParentApp.zip -d .
        if [ -d "ParentApp" ]; then
          mv ParentApp/* .
          mv ParentApp/.* . 2>/dev/null || true
        fi

    - name: Titanium Repair Build Files
      run: |
        # 1. Fix the Gradle Plugin version
        find . -type f \( -name "*.gradle" -o -name "*.kts" \) -exec sed -i 's/gradle:8\.5/gradle:8.2.2/g' {} +
        
        # 2. Fix the "Blank Version" Compose errors (the double dots)
        # This forces version 1.5.0 onto any compose library missing a version
        find . -type f \( -name "*.gradle" -o -name "*.kts" \) -exec sed -i 's/ui-tooling:[\ ]*[\$].*/ui-tooling:1.5.0"/g' {} +
        find . -type f \( -name "*.gradle" -o -name "*.kts" \) -exec sed -i 's/ui-test-manifest:[\ ]*[\$].*/ui-test-manifest:1.5.0"/g' {} +
        
        # 3. Inject missing repositories and standard versions at the top of build.gradle
        sed -i '1i buildscript { ext.compose_version = "1.5.0"; repositories { google(); mavenCentral() }; dependencies { classpath "com.android.tools.build:gradle:8.2.2" } }' build.gradle
        sed -i '1i allprojects { repositories { google(); mavenCentral() } }' build.gradle

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Build APK with System Gradle
      run: gradle assembleDebug --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Android-Parent-App
        path: app/build/outputs/apk/debug/app-debug.apk
