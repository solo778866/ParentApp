name: Build Parent App APK from Zip

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Unzip Project Files
      run: |
        unzip ParentApp.zip -d .
        # Move files out of subfolder if necessary
        if [ -d "ParentApp" ]; then
          mv ParentApp/* .
          mv ParentApp/.* . 2>/dev/null || true
        fi

    - name: Repair Build Files
      run: |
        # Fix the broken version numbers the AI generated
        find . -name "build.gradle" -exec sed -i 's/gradle:8.5/gradle:8.2.2/g' {} +
        # Ensure Google's repository is prioritized
        find . -name "build.gradle" -exec sed -i '/repositories {/a \        google()' {} +

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Build APK with System Gradle
      run: gradle assembleDebug --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Android-Parent-App
        path: app/build/outputs/apk/debug/app-debug.apk
